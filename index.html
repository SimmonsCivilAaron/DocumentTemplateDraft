<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCC Document Builder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #2D3691;
    --accent: #29ACE4;
    --lightblue: #D6EEF9;
    --darktext: #444444;
    --subtle: #595959;
    --stripe: #F2F2F2;
    --border: #CCCCCC;
    --white: #FFFFFF;
    --alert: #FFE699;
  }

  body {
    font-family: Arial, sans-serif;
    background: #F0F2F5;
    color: var(--darktext);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── APP SHELL ── */
  .app-header {
    background: var(--navy);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--accent);
  }
  .app-header img { height: 40px; display: block; }
  .app-header-title {
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;
    opacity: 0.9;
  }

  .app-body {
    display: flex;
    flex: 1;
    gap: 0;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: #fff;
    border-right: 1px solid var(--border);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: bold;
    color: var(--subtle);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0 18px 8px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 13px;
    color: var(--darktext);
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .sidebar-item:hover { background: var(--lightblue); }
  .sidebar-item.active {
    border-left-color: var(--accent);
    background: var(--lightblue);
    color: var(--navy);
    font-weight: bold;
  }
  .sidebar-icon {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  /* ── MAIN AREA ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .main-toolbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-size: 14px;
    font-weight: bold;
    color: var(--navy);
    flex: 1;
    min-width: 120px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    transition: opacity 0.15s, transform 0.1s;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-accent  { background: var(--accent); color: #fff; }
  .btn-outline { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-ghost   { background: transparent; color: var(--subtle); border: 1px solid var(--border); }
  .btn-danger  { background: #c0392b; color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── SPLIT PANE ── */
  .split-pane {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .editor-pane {
    width: 50%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: #fff;
    overflow: hidden;
  }
  .preview-pane {
    width: 50%;
    background: var(--stripe);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .pane-header {
    background: var(--lightblue);
    padding: 8px 16px;
    font-size: 11px;
    font-weight: bold;
    color: var(--navy);
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── FORM SECTIONS ── */
  .form-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .form-section {
    margin-bottom: 20px;
  }
  .form-section-title {
    font-size: 11px;
    font-weight: bold;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--lightblue);
    margin-bottom: 12px;
  }
  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 140px;
  }
  .form-group.full { flex-basis: 100%; }
  label {
    font-size: 11px;
    font-weight: bold;
    color: var(--subtle);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="text"], input[type="date"], input[type="number"],
  select, textarea {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: var(--darktext);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 9px;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 72px; }

  /* dynamic rows */
  .dynamic-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .dynamic-row input, .dynamic-row textarea, .dynamic-row select {
    flex: 1;
  }
  .btn-remove {
    background: none;
    border: none;
    color: #c0392b;
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .btn-add {
    font-size: 11px;
    padding: 5px 12px;
    margin-top: 4px;
  }

  /* ── PREVIEW ── */
  .preview-inner {
    flex: 1;
    padding: 24px;
    display: flex;
    justify-content: center;
  }

  .doc-preview {
    background: #fff;
    width: 100%;
    max-width: 720px;
    min-height: 900px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    padding: 0;
    font-family: Arial, sans-serif;
    font-size: 10pt;
    color: var(--darktext);
    border: 1px solid var(--border);
  }

  /* ── DOC STYLES ── */
  .doc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px 10px;
    border-bottom: 2.5px solid var(--accent);
    margin-bottom: 0;
  }
  .doc-header img { height: 38px; }
  .doc-header-confidential {
    font-size: 8pt;
    font-weight: bold;
    color: var(--navy);
    letter-spacing: 0.5px;
  }

  .doc-body { padding: 20px 24px 24px; }

  .doc-title {
    font-size: 14pt;
    font-weight: bold;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .doc-meta {
    font-size: 9pt;
    color: var(--subtle);
    margin-bottom: 0;
  }
  .doc-rule {
    height: 0;
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0 16px;
  }

  .doc-section-title {
    font-size: 11pt;
    font-weight: bold;
    color: var(--navy);
    margin: 18px 0 8px;
  }
  .doc-sub-title {
    font-size: 10pt;
    font-weight: bold;
    color: var(--navy);
    margin: 14px 0 6px;
  }
  .doc-body-text {
    font-size: 9pt;
    color: var(--darktext);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .doc-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 16px;
    font-size: 9pt;
  }
  .doc-table th {
    background: var(--lightblue);
    color: var(--navy);
    font-weight: bold;
    padding: 6px 8px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .doc-table td {
    padding: 6px 8px;
    border: 1px solid var(--border);
    color: var(--darktext);
  }
  .doc-table tr:nth-child(even) td { background: var(--stripe); }
  .doc-table tr:nth-child(odd) td  { background: #fff; }
  .doc-table .alert-row td         { background: var(--alert); }

  .doc-footer {
    border-top: 1px solid var(--border);
    padding: 8px 24px 12px;
    display: flex;
    justify-content: space-between;
    font-size: 8pt;
    color: var(--subtle);
    margin-top: 24px;
  }

  .status-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 3px;
    font-size: 8pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-open    { background: #D6EEF9; color: #2D3691; }
  .badge-closed  { background: #D5F5E3; color: #1a7a3a; }
  .badge-pending { background: var(--alert); color: #7a5a00; }
  .badge-urgent  { background: #FADBD8; color: #c0392b; }

  .signature-block {
    display: flex;
    gap: 32px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .sig-field {
    flex: 1;
    min-width: 140px;
    border-top: 1px solid var(--border);
    padding-top: 6px;
    font-size: 8pt;
    color: var(--subtle);
  }

  /* ── EXPORT MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 6px;
    padding: 28px 32px;
    width: 400px;
    max-width: 95vw;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .modal-title {
    font-size: 14px;
    font-weight: bold;
    color: var(--navy);
    margin-bottom: 16px;
  }
  .modal-body { font-size: 13px; color: var(--darktext); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    z-index: 200;
    transition: opacity 0.3s;
    opacity: 0;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .split-pane { flex-direction: column; }
    .editor-pane, .preview-pane { width: 100%; }
    .sidebar { width: 100%; min-width: unset; flex-direction: row; flex-wrap: wrap; padding: 8px; border-right: none; border-bottom: 1px solid var(--border); }
    .app-body { flex-direction: column; }
  }
</style>
</head>

// ── STATE ─────────────────────────────────────────────────────────────────
let currentTemplate = "safety";
let formData = {};
let dynamicRows = {};

function selectTemplate(t) {
  currentTemplate = t;
  formData = {};
  dynamicRows = {};
  document.querySelectorAll(".sidebar-item").forEach(el => {
    el.classList.toggle("active", el.dataset.template === t);
  });
  document.getElementById("toolbarTitle").textContent = TEMPLATES[t].label;
  renderForm();
  renderPreview();
}

// ── FORM RENDERING ────────────────────────────────────────────────────────
function renderForm() {
  const tpl = TEMPLATES[currentTemplate];
  const container = document.getElementById("formContainer");
  let html = "";
  tpl.fields.forEach(f => {
    if (f.section) {
      html += `<div class="form-section-title">${f.section}</div>`;
      return;
    }
    html += `<div class="form-group full" style="margin-bottom:10px">`;
    html += `<label for="f_${f.id}">${f.label}</label>`;
    if (f.type === "text" || f.type === "number") {
      const inputType = f.type === "number" ? "number" : "text";
      html += `<input type="${inputType}" id="f_${f.id}" placeholder="${f.placeholder||''}" oninput="setField('${f.id}',this.value)">`;
    } else if (f.type === "date") {
      html += `<input type="date" id="f_${f.id}" oninput="setField('${f.id}',this.value)">`;
    } else if (f.type === "textarea") {
      html += `<textarea id="f_${f.id}" placeholder="${f.placeholder||''}" oninput="setField('${f.id}',this.value)"></textarea>`;
    } else if (f.type === "select") {
      html += `<select id="f_${f.id}" onchange="setField('${f.id}',this.value)">`;
      f.options.forEach(o => { html += `<option>${o}</option>`; });
      html += `</select>`;
    } else if (f.type === "dynamic-rows") {
      if (!dynamicRows[f.id]) dynamicRows[f.id] = [Array(f.cols.length).fill("")];
      html += renderDynamicRows(f.id, f.cols, false);
    } else if (f.type === "dynamic-rows-status") {
      if (!dynamicRows[f.id]) dynamicRows[f.id] = [Array(f.cols.length).fill("")];
      html += renderDynamicRows(f.id, f.cols, true);
    } else if (f.type === "dynamic-rows-cost") {
      if (!dynamicRows[f.id]) dynamicRows[f.id] = [Array(f.cols.length).fill("")];
      html += renderDynamicRowsCost(f.id, f.cols);
    }
    html += `</div>`;
  });
  container.innerHTML = `<div class="form-section">${html}</div>`;
  // restore values
  Object.keys(formData).forEach(id => {
    const el = document.getElementById("f_" + id);
    if (el) el.value = formData[id];
  });
}

function renderDynamicRows(id, cols, hasStatus) {
  const rows = dynamicRows[id] || [Array(cols.length).fill("")];
  let html = `<div id="dynRows_${id}">`;
  rows.forEach((row, ri) => {
    html += `<div class="dynamic-row" id="dr_${id}_${ri}">`;
    cols.forEach((col, ci) => {
      if (hasStatus && ci === 1) {
        html += `<select style="flex:1;font-size:12px" onchange="setDynRow('${id}',${ri},${ci},this.value)">
          <option value="">Select</option>
          <option value="Pass" ${row[ci]==="Pass"?"selected":""}>Pass</option>
          <option value="Fail" ${row[ci]==="Fail"?"selected":""}>Fail</option>
          <option value="N/A" ${row[ci]==="N/A"?"selected":""}>N/A</option>
        </select>`;
      } else {
        html += `<input type="text" placeholder="${col}" value="${(row[ci]||'').replace(/"/g,'&quot;')}" onchange="setDynRow('${id}',${ri},${ci},this.value)" style="flex:${ci===0?2:1}">`;
      }
    });
    html += `<button class="btn-remove" onclick="removeDynRow('${id}',${ri})">&#215;</button>`;
    html += `</div>`;
  });
  html += `</div>`;
  html += `<button class="btn btn-ghost btn-add" onclick="addDynRow('${id}',${cols.length})">+ Add Row</button>`;
  return html;
}

function renderDynamicRowsCost(id, cols) {
  const rows = dynamicRows[id] || [Array(cols.length).fill("")];
  let html = `<div id="dynRows_${id}">`;
  rows.forEach((row, ri) => {
    html += `<div class="dynamic-row" id="dr_${id}_${ri}">`;
    cols.forEach((col, ci) => {
      const flex = ci === 0 ? 3 : 1;
      html += `<input type="text" placeholder="${col}" value="${(row[ci]||'').replace(/"/g,'&quot;')}" onchange="setDynRow('${id}',${ri},${ci},this.value)" style="flex:${flex}">`;
    });
    html += `<button class="btn-remove" onclick="removeDynRow('${id}',${ri})">&#215;</button>`;
    html += `</div>`;
  });
  html += `</div>`;
  html += `<button class="btn btn-ghost btn-add" onclick="addDynRow('${id}',${cols.length})">+ Add Row</button>`;
  return html;
}

function setField(id, val) {
  formData[id] = val;
  renderPreview();
}

function setDynRow(id, ri, ci, val) {
  if (!dynamicRows[id]) dynamicRows[id] = [];
  if (!dynamicRows[id][ri]) dynamicRows[id][ri] = [];
  dynamicRows[id][ri][ci] = val;
  renderPreview();
}

function addDynRow(id, numCols) {
  if (!dynamicRows[id]) dynamicRows[id] = [];
  dynamicRows[id].push(Array(numCols).fill(""));
  renderForm();
  renderPreview();
}

function removeDynRow(id, ri) {
  if (!dynamicRows[id] || dynamicRows[id].length <= 1) return;
  dynamicRows[id].splice(ri, 1);
  renderForm();
  renderPreview();
}

function resetForm() {
  formData = {};
  dynamicRows = {};
  renderForm();
  renderPreview();
}

// ── PREVIEW RENDERING ────────────────────────────────────────────────────
function fv(id, fallback) {
  return formData[id] || fallback || "";
}

function formatDate(d) {
  if (!d) return "";
  const parts = d.split("-");
  if (parts.length !== 3) return d;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function renderPreview() {
  const t = currentTemplate;
  const tpl = TEMPLATES[t];
  let body = "";

  // Build document title
  const docTitle = tpl.label.toUpperCase();
  const projectStr = fv("project", "Project Name");
  const dateStr = fv("date") ? formatDate(fv("date")) : TODAY;
  const jobStr = fv("jobNo") ? `Job #${fv("jobNo")}` : "";

  body += `
    <div class="doc-header">
      <img src="${LOGO}" alt="SCC">
      <span class="doc-header-confidential">CONFIDENTIAL</span>
    </div>
    <div class="doc-body">
      <div class="doc-title">${docTitle}</div>
      <div class="doc-meta">${[projectStr, jobStr, dateStr].filter(Boolean).join("  |  ")}</div>
      <hr class="doc-rule">
  `;

  // Template-specific content
  if (t === "safety")       body += renderSafetyBody();
  else if (t === "environmental") body += renderEnvironmentalBody();
  else if (t === "quality") body += renderQualityBody();
  else if (t === "variation") body += renderVariationBody();
  else if (t === "delay")   body += renderDelayBody();
  else if (t === "progress") body += renderProgressBody();

  body += signOff();
  body += `</div>`;
  body += footer(fv("jobNo"), tpl.label, fv("preparedBy") || fv("inspector"));

  document.getElementById("docPreview").innerHTML = body;
}

function infoTable(rows) {
  let html = `<table class="doc-table"><tbody>`;
  rows.forEach((r, i) => {
    const shade = i % 2 === 0 ? "" : ` style="background:var(--stripe)"`;
    html += `<tr${shade}><td style="width:35%;font-weight:bold;color:var(--navy)">${r[0]}</td><td>${r[1] || "<span style=\"color:var(--border)\">—</span>"}</td></tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function dynTable(id, cols) {
  const rows = dynamicRows[id] || [];
  if (!rows.length || rows.every(r => r.every(c => !c))) return `<p class="doc-body-text" style="color:var(--border)">No entries.</p>`;
  let html = `<table class="doc-table"><thead><tr>`;
  cols.forEach(c => { html += `<th>${c}</th>`; });
  html += `</tr></thead><tbody>`;
  rows.forEach((row, i) => {
    const shade = i % 2 === 0 ? "" : ` style="background:var(--stripe)"`;
    const hasPass = row[1] === "Fail";
    const cls = hasPass ? ` class="alert-row"` : "";
    html += `<tr${cls || shade}>`;
    row.forEach(c => { html += `<td>${c || ""}</td>`; });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function textBlock(id, fallback) {
  const v = fv(id);
  if (!v) return `<p class="doc-body-text" style="color:var(--border)">${fallback || "Not provided."}</p>`;
  return `<p class="doc-body-text">${v.replace(/\n/g,"<br>")}</p>`;
}

function signOff() {
  const reviewer = fv("reviewedBy", "Authorised Reviewer");
  return `
    <div class="doc-section-title">Sign-Off</div>
    <div class="signature-block">
      <div class="sig-field">Prepared By<br><strong>${fv("preparedBy") || fv("inspector") || "&nbsp;"}</strong></div>
      <div class="sig-field">Reviewed / Approved By (Role)<br><strong>${reviewer || "&nbsp;"}</strong></div>
      <div class="sig-field">Date<br><strong>${fv("date") ? formatDate(fv("date")) : "&nbsp;"}</strong></div>
    </div>`;
}

function footer(jobNo, title, preparedBy) {
  const ref = [jobNo, title].filter(Boolean).join(" — ");
  return `
    <div class="doc-footer">
      <span>${ref || "Simmons Civil Contracting"}</span>
      <span>Page 1</span>
    </div>`;
}

// ── SAFETY ──
function renderSafetyBody() {
  let h = "";
  h += `<div class="doc-section-title">Project Details</div>`;
  h += infoTable([
    ["Project", fv("project")],
    ["Job Number", fv("jobNo")],
    ["Client / Head Contractor", fv("client")],
    ["Report Date", fv("date") ? formatDate(fv("date")) : ""],
    ["Prepared By", fv("preparedBy")],
  ]);
  h += `<div class="doc-section-title">Incident / Observation</div>`;
  h += infoTable([
    ["Incident Type", fv("incidentType")],
    ["Location on Site", fv("location")],
  ]);
  h += `<div class="doc-sub-title">Description</div>`;
  h += textBlock("description");
  h += `<div class="doc-sub-title">Immediate Action Taken</div>`;
  h += textBlock("immediateAction");
  h += `<div class="doc-section-title">Root Cause Analysis</div>`;
  h += textBlock("rootCause");
  h += `<div class="doc-section-title">Corrective Actions</div>`;
  h += dynTable("actions", ["Action Description", "Responsible", "Due Date"]);
  return h;
}

// ── ENVIRONMENTAL ──
function renderEnvironmentalBody() {
  let h = "";
  h += `<div class="doc-section-title">Project Details</div>`;
  h += infoTable([
    ["Project", fv("project")],
    ["Job Number", fv("jobNo")],
    ["Client", fv("client")],
    ["Report Date", fv("date") ? formatDate(fv("date")) : ""],
    ["Prepared By", fv("preparedBy")],
  ]);
  h += `<div class="doc-section-title">Environmental Observations</div>`;
  h += textBlock("observations");
  h += `<div class="doc-sub-title">Non-Conformances Identified</div>`;
  h += textBlock("nonConformances");
  h += `<div class="doc-section-title">Controls in Place</div>`;
  h += dynTable("controls", ["Control Measure", "Location", "Condition"]);
  h += `<div class="doc-section-title">Corrective Actions</div>`;
  h += dynTable("actions", ["Action", "Responsible", "Due Date"]);
  return h;
}

// ── QUALITY ──
function renderQualityBody() {
  let h = "";
  h += `<div class="doc-section-title">Project Details</div>`;
  h += infoTable([
    ["Project", fv("project")],
    ["Job Number", fv("jobNo")],
    ["Client", fv("client")],
    ["Inspection Date", fv("date") ? formatDate(fv("date")) : ""],
    ["Inspector", fv("inspector")],
  ]);
  h += `<div class="doc-section-title">Inspection Scope</div>`;
  h += textBlock("scope");
  h += infoTable([["Applicable Standard", fv("standard")]]);
  h += `<div class="doc-section-title">Inspection Checklist</div>`;
  h += dynTable("items", ["Item / Criteria", "Result", "Comment"]);
  h += `<div class="doc-section-title">Defects / Non-Conformances</div>`;
  h += textBlock("defects");
  h += dynTable("defectActions", ["Action", "Responsible", "Due Date"]);
  const outcome = fv("outcome","—");
  const badgeClass = outcome.startsWith("Pass") && !outcome.includes("Fail") ? "badge-closed" : outcome.includes("Conditional") ? "badge-pending" : "badge-urgent";
  h += `<div class="doc-section-title">Outcome</div>`;
  h += `<p class="doc-body-text"><span class="status-badge ${badgeClass}">${outcome}</span></p>`;
  h += `<div class="doc-sub-title">Comments</div>`;
  h += textBlock("comments");
  return h;
}

// ── VARIATION ──
function renderVariationBody() {
  let h = "";
  h += `<div class="doc-section-title">Variation Reference</div>`;
  h += infoTable([
    ["Project", fv("project")],
    ["Job Number", fv("jobNo")],
    ["Client / Head Contractor", fv("client")],
    ["Contract Reference", fv("contract")],
    ["Variation Number", fv("varNo")],
    ["Date Submitted", fv("date") ? formatDate(fv("date")) : ""],
    ["Prepared By", fv("preparedBy")],
  ]);
  h += `<div class="doc-section-title">Variation Details</div>`;
  h += infoTable([
    ["Variation Title", fv("title")],
    ["Cause of Variation", fv("cause")],
  ]);
  h += `<div class="doc-sub-title">Description</div>`;
  h += textBlock("description");
  h += `<div class="doc-sub-title">Contractual Basis</div>`;
  h += textBlock("contractualBasis");

  // Cost table
  h += `<div class="doc-section-title">Cost Summary</div>`;
  const costRows = dynamicRows["costItems"] || [];
  const hasData = costRows.some(r => r.some(c => c));
  if (hasData) {
    let total = 0;
    let html = `<table class="doc-table"><thead><tr>`;
    ["Description","Qty","Unit","Rate ($)","Amount ($)"].forEach(c => { html += `<th>${c}</th>`; });
    html += `</tr></thead><tbody>`;
    costRows.forEach((row, i) => {
      const shade = i % 2 === 0 ? "" : ` style="background:var(--stripe)"`;
      html += `<tr${shade}>`;
      row.forEach((c, ci) => { html += `<td>${c||""}</td>`; });
      const amt = parseFloat(row[4]) || 0;
      total += amt;
      html += `</tr>`;
    });
    const margin = parseFloat(fv("margin")) || 0;
    const marginAmt = total * margin / 100;
    const grandTotal = total + marginAmt;
    html += `<tr style="background:var(--lightblue)"><td colspan="4" style="font-weight:bold;color:var(--navy)">Subtotal</td><td style="font-weight:bold;color:var(--navy)">$${total.toFixed(2)}</td></tr>`;
    if (margin) {
      html += `<tr><td colspan="4">Margin / Overheads (${margin}%)</td><td>$${marginAmt.toFixed(2)}</td></tr>`;
      html += `<tr style="background:var(--navy)"><td colspan="4" style="font-weight:bold;color:#fff">TOTAL CLAIMED</td><td style="font-weight:bold;color:#fff">$${grandTotal.toFixed(2)}</td></tr>`;
    } else {
      html += `<tr style="background:var(--navy)"><td colspan="4" style="font-weight:bold;color:#fff">TOTAL CLAIMED</td><td style="font-weight:bold;color:#fff">$${total.toFixed(2)}</td></tr>`;
    }
    html += `</tbody></table>`;
    h += html;
  } else {
    h += `<p class="doc-body-text" style="color:var(--border)">No cost items entered.</p>`;
  }

  const eot = fv("eotClaimed");
  h += `<div class="doc-section-title">Programme Impact</div>`;
  h += infoTable([["EOT Claimed (days)", eot || "Nil"]]);
  h += textBlock("programmeNote");
  h += `<div class="doc-section-title">Supporting Documents</div>`;
  h += dynTable("attachments", ["Document Reference", "Description"]);
  return h;
}

// ── DELAY ──
function renderDelayBody() {
  let h = "";
  h += `<div class="doc-section-title">Notice Reference</div>`;
  h += infoTable([
    ["Project", fv("project")],
    ["Job Number", fv("jobNo")],
    ["Client / Head Contractor", fv("client")],
    ["Contract Reference", fv("contract")],
    ["Notice Number", fv("noticeNo")],
    ["Date of Notice", fv("date") ? formatDate(fv("date")) : ""],
    ["Prepared By", fv("preparedBy")],
  ]);
  h += `<div class="doc-section-title">Delay Details</div>`;
  h += infoTable([
    ["Delay Type", fv("delayType")],
    ["Delay Start Date", fv("startDate") ? formatDate(fv("startDate")) : ""],
    ["Anticipated End Date", fv("endDate") ? formatDate(fv("endDate")) : ""],
    ["Days Impacted", fv("daysImpacted")],
  ]);
  h += `<div class="doc-sub-title">Description of Delay Event</div>`;
  h += textBlock("description");
  h += `<div class="doc-sub-title">Cause and Responsibility</div>`;
  h += textBlock("cause");
  h += `<div class="doc-section-title">Programme Impact</div>`;
  h += dynTable("activitiesImpacted", ["Activity / Trade", "Impact Description", "Days"]);
  h += infoTable([["EOT Claimed (calendar days)", fv("eotClaimed") || "Nil"]]);
  h += `<div class="doc-sub-title">Costs Incurred</div>`;
  h += textBlock("costsIncurred");
  h += `<div class="doc-section-title">Mitigation</div>`;
  h += textBlock("mitigation");
  return h;
}

// ── PROGRESS ──
function renderProgressBody() {
  let h = "";
  h += `<div class="doc-section-title">Report Details</div>`;
  h += infoTable([
    ["Project", fv("project")],
    ["Job Number", fv("jobNo")],
    ["Client", fv("client")],
    ["Reporting Period", fv("reportPeriod")],
    ["Report Date", fv("date") ? formatDate(fv("date")) : ""],
    ["Prepared By", fv("preparedBy")],
  ]);
  h += `<div class="doc-section-title">Works Completed This Period</div>`;
  h += textBlock("worksCompleted");

  const status = fv("overallStatus","—");
  const pct = fv("percentComplete");
  const badgeClass = status === "On Programme" || status === "Ahead of Programme" ? "badge-closed"
    : status === "Minor Delay" ? "badge-pending"
    : status === "Behind Programme" || status === "Critical Delay" ? "badge-urgent" : "badge-open";
  h += `<div class="doc-section-title">Programme Status</div>`;
  h += `<p class="doc-body-text"><span class="status-badge ${badgeClass}">${status}</span>${pct ? `&nbsp;&nbsp;${pct}% Complete` : ""}</p>`;
  h += textBlock("programmeNotes");

  h += `<div class="doc-section-title">Works Planned Next Period</div>`;
  h += textBlock("worksPlanned");
  h += `<div class="doc-section-title">Issues and Risks</div>`;
  h += dynTable("issues", ["Issue", "Status", "Action Owner"]);
  h += `<div class="doc-section-title">Resources on Site</div>`;
  h += dynTable("resources", ["Resource", "Quantity", "Notes"]);
  h += `<div class="doc-section-title">Outstanding RFIs / Submittals</div>`;
  h += dynTable("rfis", ["Ref", "Subject", "Status"]);
  return h;
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function openExport()  { document.getElementById("exportModal").classList.add("open"); }
function closeExport() { document.getElementById("exportModal").classList.remove("open"); }

function exportPDF() {
  closeExport();
  printPreview();
}

function printPreview() {
  const preview = document.getElementById("docPreview").outerHTML;
  const win = window.open("", "_blank");
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${TEMPLATES[currentTemplate].label}</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 32px; color: #444; }
      ${getPrintStyles()}
    </style>
    </head><body>${preview}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 300);
}

function getPrintStyles() {
  return `
    .doc-preview { box-shadow: none; border: none; max-width: 100%; }
    .doc-header { display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 8px; border-bottom: 2.5px solid #29ACE4; }
    .doc-header img { height: 38px; }
    .doc-header-confidential { font-size: 8pt; font-weight: bold; color: #2D3691; }
    .doc-body { padding: 16px 0; }
    .doc-title { font-size: 14pt; font-weight: bold; color: #2D3691; margin-bottom: 4px; }
    .doc-meta { font-size: 9pt; color: #595959; }
    .doc-rule { border: none; border-top: 1px solid #CCCCCC; margin: 10px 0 16px; }
    .doc-section-title { font-size: 11pt; font-weight: bold; color: #2D3691; margin: 18px 0 8px; }
    .doc-sub-title { font-size: 10pt; font-weight: bold; color: #2D3691; margin: 14px 0 6px; }
    .doc-body-text { font-size: 9pt; color: #444; line-height: 1.5; margin-bottom: 8px; }
    .doc-table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 9pt; }
    .doc-table th { background: #D6EEF9; color: #2D3691; font-weight: bold; padding: 6px 8px; border: 1px solid #CCC; }
    .doc-table td { padding: 6px 8px; border: 1px solid #CCC; color: #444; }
    .doc-table tr:nth-child(even) td { background: #F2F2F2; }
    .doc-footer { border-top: 1px solid #CCC; padding: 8px 0; display: flex;
      justify-content: space-between; font-size: 8pt; color: #595959; margin-top: 24px; }
    .status-badge { display: inline-block; padding: 2px 9px; border-radius: 3px;
      font-size: 8pt; font-weight: bold; text-transform: uppercase; }
    .badge-open { background: #D6EEF9; color: #2D3691; }
    .badge-closed { background: #D5F5E3; color: #1a7a3a; }
    .badge-pending { background: #FFE699; color: #7a5a00; }
    .badge-urgent { background: #FADBD8; color: #c0392b; }
    .signature-block { display: flex; gap: 32px; margin-top: 24px; }
    .sig-field { flex: 1; border-top: 1px solid #CCC; padding-top: 6px; font-size: 8pt; color: #595959; }
    .alert-row td { background: #FFE699 !important; }
  `;
}

function exportHTML() {
  closeExport();
  const preview = document.getElementById("docPreview").outerHTML;
  const title = TEMPLATES[currentTemplate].label;
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>${title} — Simmons Civil Contracting</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background: #F0F2F5; }
.doc-preview { background: #fff; max-width: 800px; margin: 0 auto; padding: 0;
  box-shadow: 0 2px 16px rgba(0,0,0,0.1); border: 1px solid #CCC; }
${getPrintStyles()}
</style></head><body>${preview}</body></html>`;
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${title.replace(/ /g,"_")}_SCC.html`;
  a.click();
  showToast("HTML file downloaded.");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

// ── INIT ──────────────────────────────────────────────────────────────────
selectTemplate("safety");
</script>
